[project]
name = "dalil-ai"
version = "1.0.0"
description = "Dalil AI - Intelligent Business Data Analysis Chatbot for Tafseela"
requires-python = ">=3.11"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I"]
