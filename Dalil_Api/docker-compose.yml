# ============================================
# Dalil AI — Docker Compose
# ============================================
# Usage:
#   docker-compose up -d          (start)
#   docker-compose down           (stop)
#   docker-compose logs -f app    (view logs)
# ============================================

version: "3.9"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dalil-ai-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - PYTHONPATH=/app
    volumes:
      - upload_data:/app/uploads
      - cache_data:/app/data_cache
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  upload_data:
  cache_data:
